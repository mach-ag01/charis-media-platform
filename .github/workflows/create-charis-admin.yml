
name: Create Charis Media Administrator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-admin:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DJANGO_SUPERUSER_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      DJANGO_SUPERUSER_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      DJANGO_SUPERUSER_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate required secrets
        run: |
          test -n "$DATABASE_URL" || (echo "DATABASE_URL is missing" && exit 1)
          test -n "$SECRET_KEY" || (echo "DJANGO_SECRET_KEY is missing" && exit 1)
          test -n "$DJANGO_SUPERUSER_USERNAME" || (echo "ADMIN_USERNAME is missing" && exit 1)
          test -n "$DJANGO_SUPERUSER_EMAIL" || (echo "ADMIN_EMAIL is missing" && exit 1)
          test -n "$DJANGO_SUPERUSER_PASSWORD" || (echo "ADMIN_PASSWORD is missing" && exit 1)

          if [ ${#DJANGO_SUPERUSER_PASSWORD} -lt 10 ]; then
            echo "ADMIN_PASSWORD must contain at least 10 characters."
            exit 1
          fi

          echo "Required configuration is present."

      - name: Create or reset administrator
        working-directory: backend
        run: |
          python manage.py shell <<'PY'
          import os
          from django.contrib.auth import get_user_model

          User = get_user_model()

          username = os.environ["DJANGO_SUPERUSER_USERNAME"]
          email = os.environ["DJANGO_SUPERUSER_EMAIL"]
          password = os.environ["DJANGO_SUPERUSER_PASSWORD"]

          user = User.objects.filter(username=username).first()

          if user:
              if not user.is_superuser:
                  raise RuntimeError(
                      "The username belongs to a non-superuser. "
                      "No account was changed."
                  )

              user.email = email
              user.is_active = True
              user.is_staff = True
              user.is_superuser = True
              user.set_password(password)
              user.save()

              print("SUCCESS: Existing administrator password reset.")
          else:
              User.objects.create_superuser(
                  username=username,
                  email=email,
                  password=password
              )

              print("SUCCESS: New administrator created.")
          PY
